{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>{% block title %}Sign in{% endblock %} - PG Food Delivery Admin</title>

    <!-- Theme Initialization to Prevent Flash of Unstyled Content -->
    <script>
      (function() {
        var theme = localStorage.getItem('tabler-theme') || localStorage.getItem('tabler-theme-mode');
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-bs-theme');
        }
      })();
    </script>

    <!-- Tabler Pro Stylesheets -->
    <link href="{% static 'tabler/dist/css/tabler.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/admin-custom.css' %}" rel="stylesheet" />

    <style>
      @import url("https://rsms.me/inter/inter.css");
      :root {
        --tblr-font-sans-serif: 'Inter', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
      }
    </style>
  </head>
  <body class="d-flex flex-column">
    <script src="{% static 'tabler/dist/js/tabler-theme.min.js' %}"></script>

    <!-- One-Click Floating Theme Switcher on Login Page (Button only, rounded corner with shadow) -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
      <!-- Shown in Light Mode: click to switch to Dark Mode -->
      <button type="button" class="btn btn-icon btn-outline-secondary rounded-3 shadow-sm theme-toggle-btn hide-theme-dark" title="Switch to Dark Mode" data-bs-toggle="tooltip" data-bs-placement="left" aria-label="Switch to Dark Mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-moon">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
        </svg>
      </button>

      <!-- Shown in Dark Mode: click to switch to Light Mode -->
      <button type="button" class="btn btn-icon btn-outline-secondary rounded-3 shadow-sm theme-toggle-btn hide-theme-light" title="Switch to Light Mode" data-bs-toggle="tooltip" data-bs-placement="left" aria-label="Switch to Light Mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-sun text-warning">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
          <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
        </svg>
      </button>
    </div>

    <div class="page page-center">
      <div class="container container-tight py-4">
        {% block content %}{% endblock %}
      </div>
    </div>

    <!-- Modals & Toasts -->
    {% include 'includes/toast_messages.html' %}

    <!-- Tabler Core JS -->
    <script src="{% static 'tabler/dist/js/tabler.min.js' %}"></script>
    <script src="{% static 'js/theme-manager.js' %}"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
